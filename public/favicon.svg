<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="towerGradCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="towerGradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="towerGradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Glowing Inner Border -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#38bdf8" stroke-width="5" stroke-opacity="0.3" />

  <g filter="url(#shadow)">
    <!-- Left Building (Medium Height) -->
    <path d="M 120 220 L 195 190 L 195 400 L 120 400 Z" fill="url(#towerGradLeft)" />
    <!-- Left Windows -->
    <rect x="136" y="235" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="166" y="235" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="136" y="275" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="166" y="275" width="18" height="22" rx="3" fill="#fef08a" />
    <rect x="136" y="315" width="18" height="22" rx="3" fill="#fef08a" />
    <rect x="166" y="315" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="136" y="355" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="166" y="355" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />

    <!-- Right Building (Mid-Tall Height) -->
    <path d="M 315 170 L 392 200 L 392 400 L 315 400 Z" fill="url(#towerGradRight)" />
    <!-- Right Windows -->
    <rect x="328" y="215" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="358" y="215" width="18" height="22" rx="3" fill="#fef08a" />
    <rect x="328" y="255" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="358" y="255" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="328" y="295" width="18" height="22" rx="3" fill="#fef08a" />
    <rect x="358" y="295" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="328" y="335" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="358" y="335" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.9" />

    <!-- Center Main Tower (Skyline Heights Pinnacle) -->
    <!-- Architectural Spire -->
    <path d="M 251 72 L 261 72 L 258 115 L 254 115 Z" fill="#fde047" />
    <!-- Slanted Apex Roof & Body -->
    <path d="M 182 155 L 256 115 L 330 155 L 330 400 L 182 400 Z" fill="url(#towerGradCenter)" />
    <!-- Center Highlight Ridge -->
    <path d="M 256 115 L 256 400" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.5" />

    <!-- Center Windows Grid -->
    <rect x="202" y="175" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="232" y="175" width="18" height="24" rx="3" fill="#fef08a" />
    <rect x="262" y="175" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="292" y="175" width="18" height="24" rx="3" fill="#ffffff" />

    <rect x="202" y="215" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="232" y="215" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="262" y="215" width="18" height="24" rx="3" fill="#fef08a" />
    <rect x="292" y="215" width="18" height="24" rx="3" fill="#ffffff" />

    <rect x="202" y="255" width="18" height="24" rx="3" fill="#fef08a" />
    <rect x="232" y="255" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="262" y="255" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="292" y="255" width="18" height="24" rx="3" fill="#fef08a" />

    <rect x="202" y="295" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="232" y="295" width="18" height="24" rx="3" fill="#fef08a" />
    <rect x="262" y="295" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="292" y="295" width="18" height="24" rx="3" fill="#ffffff" />

    <rect x="202" y="335" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="232" y="335" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="262" y="335" width="18" height="24" rx="3" fill="#ffffff" />
    <rect x="292" y="335" width="18" height="24" rx="3" fill="#ffffff" />

    <!-- Modern Luxury Horizon Base Platform -->
    <path d="M 88 400 L 424 400 L 424 416 C 424 422 419 427 413 427 L 99 427 C 93 427 88 422 88 416 Z" fill="url(#accentGold)" />
  </g>
</svg>
